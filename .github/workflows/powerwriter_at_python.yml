name: PowerWriter AT Python

on:
  push:
    branches:
      - main
    paths:
      - "source/powerwriter_at_commander_python/**"
      - "source/powerwriter_at_core/**"
      - ".github/workflows/powerwriter_at_python.yml"
  pull_request:
    paths:
      - "source/powerwriter_at_commander_python/**"
      - "source/powerwriter_at_core/**"
      - ".github/workflows/powerwriter_at_python.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    defaults:
      run:
        working-directory: source/powerwriter_at_commander_python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt cryptography
          python -c "import sys; print(sys.version)"
          python -c "import tkinter" || echo "tkinter unavailable; GUI build will be skipped"

      - name: Build C library (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat

      - name: Build C library (Linux)
        if: runner.os == 'Linux'
        run: bash build_linux.sh

      - name: Build C library (macOS)
        if: runner.os == 'macOS'
        run: bash build_macos.sh

      - name: Run tests
        timeout-minutes: 15
        run: python -m unittest discover -s tests -v

      - name: Build standalone executables
        run: python build_exe.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powerwriter-at-${{ matrix.platform }}
          path: |
            source/powerwriter_at_commander_python/dist/**
            source/powerwriter_at_commander_python/lib/${{ matrix.platform }}/**
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'release' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            source/powerwriter_at_commander_python/pw_at/__init__.py
          sparse-checkout-cone-mode: false

      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "${EVENT_NAME}" = "release" ]; then
            tag="${RELEASE_TAG}"
            title=""
          else
            version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' source/powerwriter_at_commander_python/pw_at/__init__.py)"
            [ -n "${version}" ] || version="0.0.0"
            tag="v${version}-build.${RUN_NUMBER}"
            title="PowerWriter AT Python v${version} build ${RUN_NUMBER}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r "../${name}.zip" .)
          done

      - name: Create push release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating assets."
          else
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "${TITLE}" \
              --generate-notes \
              --latest
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "${TAG}" artifacts/*.zip --clobber --repo "${{ github.repository }}"

      - name: Fetch release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh api "repos/${{ github.repository }}/releases/tags/${TAG}" > release.json

      - name: Sync release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: openpowerwriter
          GITEE_REPO: PowerWriter_AT_Command
          GITEE_TARGET_COMMITISH: main
        run: |
          python .github/scripts/sync_gitee_release.py \
            --event release.json \
            --tag "${{ steps.release.outputs.tag }}" \
            --target "$GITEE_TARGET_COMMITISH" \
            --assets artifacts/*.zip
